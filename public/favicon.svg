<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Fundo transparente -->
    <g fill="#0d6efd">
        <!-- Pata 1: Superior Esquerda (ligeiramente menor e inclinada) -->
        <g transform="translate(14, 10) rotate(-14 22 25) scale(0.68)">
            <!-- Almofada central -->
            <path d="M25 22 C14 22 8 32 10 42 C12 50 18 55 25 55 C32 55 38 50 40 42 C42 32 36 22 25 22 Z" />
            <!-- Dedo 1 (esquerdo) -->
            <ellipse cx="6" cy="22" rx="5" ry="7.5" transform="rotate(-25 6 22)" />
            <!-- Dedo 2 (centro-esquerdo) -->
            <ellipse cx="18" cy="11" rx="5" ry="8" transform="rotate(-8 18 11)" />
            <!-- Dedo 3 (centro-direito) -->
            <ellipse cx="32" cy="11" rx="5" ry="8" transform="rotate(8 32 11)" />
            <!-- Dedo 4 (direito) -->
            <ellipse cx="44" cy="22" rx="5" ry="7.5" transform="rotate(25 44 22)" />
        </g>

        <!-- Pata 2: Inferior Direita (ligeiramente maior e inclinada) -->
        <g transform="translate(48, 38) rotate(14 26 30) scale(0.82)">
            <!-- Almofada central -->
            <path d="M25 22 C14 22 8 32 10 42 C12 50 18 55 25 55 C32 55 38 50 40 42 C42 32 36 22 25 22 Z" />
            <!-- Dedo 1 (esquerdo) -->
            <ellipse cx="6" cy="22" rx="5" ry="7.5" transform="rotate(-25 6 22)" />
            <!-- Dedo 2 (centro-esquerdo) -->
            <ellipse cx="18" cy="11" rx="5" ry="8" transform="rotate(-8 18 11)" />
            <!-- Dedo 3 (centro-direito) -->
            <ellipse cx="32" cy="11" rx="5" ry="8" transform="rotate(8 32 11)" />
            <!-- Dedo 4 (direito) -->
            <ellipse cx="44" cy="22" rx="5" ry="7.5" transform="rotate(25 44 22)" />
        </g>
    </g>
</svg>
